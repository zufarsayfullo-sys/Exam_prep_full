<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Quiz · ExamPrep Studio</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#171d43;background:#f7f8fd}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:28px 20px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0 34px}.brand{font-size:22px;font-weight:850;letter-spacing:-.6px}.brand b{color:#6e35e8}.chip{background:#eee8ff;color:#6630d6;padding:9px 13px;border-radius:100px;font-size:13px;font-weight:750}.panel{background:#fff;border:1px solid #e8e8f2;box-shadow:0 18px 60px #1c23520a;border-radius:24px;padding:clamp(24px,5vw,42px)}h1{font-size:clamp(28px,5vw,38px);letter-spacing:-1px;margin:8px 0 10px}p{color:#6b7490;line-height:1.6;margin:0 0 28px}.steps{display:flex;gap:10px;margin-bottom:30px}.step{height:5px;background:#e9e6f5;border-radius:10px;flex:1}.step.on{background:#7438ea}label{display:block;font-weight:750;font-size:14px;margin:20px 0 10px}select{width:100%;border:1px solid #dcdff0;background:#fff;color:#24264c;padding:16px;border-radius:13px;font:inherit;outline:none}select:focus{border-color:#7744ea;box-shadow:0 0 0 3px #7744ea19}select:disabled{background:#f8f8fc;color:#9ca1b1}.meta{background:#f8f6ff;border:1px solid #eae4ff;border-radius:15px;padding:17px 19px;margin:23px 0}.meta strong{display:block;margin-bottom:6px}.meta small{color:#6e7392}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:30px}button{background:#7036e8;color:#fff;border:0;padding:15px 23px;border-radius:13px;font:inherit;font-weight:750;cursor:pointer}button:disabled{background:#dcd8e9;cursor:not-allowed}.back{background:#f0ecfa;color:#6331cb}#status{font-size:13px;color:#7c4d18;min-height:20px;margin-top:14px}a{color:#6331cb;text-decoration:none;font-weight:650}.quizcount{font-size:13px;color:#798098;margin-top:8px}@media(max-width:520px){main{padding:16px 14px}header{padding-bottom:20px}.brand{font-size:19px}.panel{border-radius:18px}.actions button{flex:1}}
</style></head><body><main><header><div class="brand">✦ ExamPrep <b>Studio</b></div><span class="chip">Teacher · Live Quiz</span></header><section class="panel"><div class="steps"><div class="step on"></div><div class="step" id="step2"></div></div><h1>Launch a live quiz</h1><p>Select a student level, then choose a quiz. Each quiz opens its own live-session screen where you can generate a QR code.</p><label for="level">1. Choose level</label><select id="level"><option value="">Select a level</option><option value="beginner">Beginner</option><option value="elementary">Elementary</option><option value="pre-int">Pre-Intermediate</option><option value="inter">Intermediate</option><option value="upper-inter">Upper-Intermediate</option></select><label for="quiz">2. Choose quiz</label><select id="quiz" disabled><option value="">Select a level first</option></select><div class="quizcount" id="count"></div><div class="meta" id="details" hidden><strong id="quiztitle"></strong><small id="quizmeta"></small></div><div class="actions"><a href="./index.html">← Main menu</a><button id="launch" disabled>Open Live Quiz →</button></div><div id="status" role="status"></div></section></main>
<script>
const $=id=>document.getElementById(id);let quizzes=[];
function cleanFile(f){if(typeof f!=='string'||!/^[-\w./]+\.html(?:\?[-\w=&.]*)?$/.test(f)||f.includes('..')||f.startsWith('/'))return null;return f;}
function extract(data){const arr=Array.isArray(data)?data:Array.isArray(data?.quizzes)?data.quizzes:Array.isArray(data?.items)?data.items:[];return arr.map((q,i)=>typeof q==='string'?{title:q,file:q}:q).filter(q=>q&&typeof q==='object'&&cleanFile(q.file||q.path||q.url));}
$('level').addEventListener('change',async()=>{const level=$('level').value;$('quiz').disabled=true;$('quiz').innerHTML='<option value="">Loading quizzes…</option>';$('launch').disabled=true;$('details').hidden=true;$('step2').classList.remove('on');$('status').textContent='';$('count').textContent='';quizzes=[];if(!level){$('quiz').innerHTML='<option value="">Select a level first</option>';return;}
try{const res=await fetch('./'+level+'/quizzes/index.json',{cache:'no-store'});if(!res.ok)throw Error('Quiz list is not available for this level.');const data=await res.json();if($('level').value!==level)return;quizzes=extract(data);$('quiz').replaceChildren();const opt=document.createElement('option');opt.value='';opt.textContent=quizzes.length?'Select a quiz':'No quizzes available yet';$('quiz').append(opt);quizzes.forEach((q,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=q.title||q.name||'Quiz '+(i+1);$('quiz').append(o)});$('quiz').disabled=!quizzes.length;$('count').textContent=quizzes.length+' quiz'+(quizzes.length===1?'':'zes')+' available';if(!quizzes.length)$('status').textContent='Add quizzes to '+level+'/quizzes/index.json to make them appear here.';}catch(e){$('quiz').innerHTML='<option value="">Unable to load quizzes</option>';$('status').textContent=e.message+' Make sure this file is hosted on GitHub Pages, not opened directly from your computer.';}});
$('quiz').addEventListener('change',()=>{const q=quizzes[Number($('quiz').value)];const chosen=$('quiz').value!==''&&!!q;$('launch').disabled=!chosen;$('details').hidden=!chosen;$('step2').classList.toggle('on',chosen);if(chosen){$('quiztitle').textContent=q.title||q.name||'Selected quiz';$('quizmeta').textContent=[q.category,q.questionCount?`${q.questionCount} questions per attempt`:null,q.bankSize?`${q.bankSize} in question bank`:null].filter(Boolean).join(' · ')||'Ready to launch';}});
$('launch').addEventListener('click',()=>{const q=quizzes[Number($('quiz').value)];if(!q||$('quiz').value==='')return;const file=cleanFile(q.file||q.path||q.url);if(!file)return;const url=new URL('./'+$('level').value+'/quizzes/'+file,location.href);location.assign(url.href);});
</script></body></html>
