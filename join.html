<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Live Quiz | ExamPrep Studio</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172554;background:#f4f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:min(100%,400px);background:white;border-radius:24px;padding:28px 22px;box-shadow:0 20px 70px #17255416}.logo{font-size:15px;font-weight:800;letter-spacing:.3px;color:#3156c8}.pill{display:inline-block;background:#eaf0ff;color:#3156c8;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;margin-top:25px}h1{font-size:30px;letter-spacing:-1px;margin:15px 0 8px}p{color:#66738c;line-height:1.55}label{display:block;font-size:13px;font-weight:750;margin:22px 0 7px}input{width:100%;border:1px solid #d8dfed;border-radius:12px;padding:15px;font:inherit;outline:none}input:focus{border-color:#466ce0;box-shadow:0 0 0 3px #466ce01c}button{width:100%;border:0;border-radius:12px;background:#2445b5;color:white;padding:16px;font-size:15px;font-weight:750;margin-top:25px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{color:#b42318;font-size:13px;margin-top:13px;min-height:18px}.code{font-weight:800;color:#172554}.hidden{display:none}.spinner{height:40px;width:40px;border:4px solid #dce6ff;border-top-color:#3156c8;border-radius:50%;animation:spin 1s linear infinite;margin:25px auto}@keyframes spin{to{transform:rotate(360deg)}}.center{text-align:center}
</style>
</head>
<body>
<main class="card">
<div class="logo">✦ ExamPrep Studio</div>
<section id="joinView">
<span class="pill">LIVE QUIZ</span><h1>Join your class quiz</h1>
<p>You're joining session <span class="code" id="codeText">—</span>. Enter your name to join the waiting room.</p>
<form id="joinForm">
<label for="name">Your full name</label><input id="name" required maxlength="80" autocomplete="name" placeholder="e.g. Ali Karimov">

<button id="joinBtn" type="submit">Join Quiz →</button>
<div class="error" id="error" role="alert"></div>
</form></section>
<section id="waitingView" class="hidden center"><span class="pill">YOU'RE IN!</span><h1>You're in the waiting room</h1><p id="welcome"></p><div class="spinner"></div><p>Waiting for your teacher to start the quiz…</p></section>
<section id="invalidView" class="hidden center"><h1>Invalid quiz link</h1><p>Please scan the QR code displayed by your teacher again.</p></section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://dfepopppcggzecdxexeho.supabase.co';
const SUPABASE_ANON_KEY='REPLACE_WITH_YOUR_SUPABASE_ANON_KEY';
const code=new URLSearchParams(location.search).get('code')?.trim();
const $=id=>document.getElementById(id);
if(!code || !/^\d{6}$/.test(code)){$('joinView').classList.add('hidden');$('invalidView').classList.remove('hidden');}
else {$('codeText').textContent=code;}
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
$('joinForm').addEventListener('submit',async e=>{
 e.preventDefault();const btn=$('joinBtn');btn.disabled=true;$('error').textContent='';
 try{
  if(SUPABASE_ANON_KEY.startsWith('REPLACE_')) throw Error('The site owner must configure the Supabase public key.');
  const name=$('name').value.trim();
  if(!name)throw Error('Enter your name.');
  // A secure RPC must be installed on Supabase before this can work.
  const {data,error}=await supabase.rpc('join_live_session',{p_session_code:code,p_full_name:name,p_class_name:'Unassigned'});
  if(error)throw error;
  const participantId=typeof data==='string'?data:data?.participant_id;
  if(!participantId)throw Error('Could not confirm your place in the quiz.');
  sessionStorage.setItem('examprep_participant_id',participantId);
  sessionStorage.setItem('examprep_session_code',code);
  $('joinView').classList.add('hidden');$('waitingView').classList.remove('hidden');$('welcome').textContent=`Welcome, ${name}!`;
  // Start notifications require a secure participant-scoped status endpoint.
  // Until that is implemented, remain in the waiting room.
 }catch(err){$('error').textContent=err.message||'Unable to join. Please try again.';}
 finally{btn.disabled=false;}
});
</script>
</body></html>
