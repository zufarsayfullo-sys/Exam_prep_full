
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | ExamPrep Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --navy: #172554;
    --blue: #3156d9;
    --background: #eff3f9;
    --border: #e2e8f0;
    --muted: #64748b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--background);
    color: var(--navy);
}

button, textarea, a {
    -webkit-tap-highlight-color: transparent;
}

button {
    cursor: pointer;
    font: inherit;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

header {
    background: var(--navy);
    color: white;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.brand {
    font-size: 17px;
    font-weight: 750;
}

.brand small {
    display: block;
    margin-top: 4px;
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 400;
}

.back {
    text-decoration: none;
    color: white;
    background: #ffffff18;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
}

.app {
    max-width: 1100px;
    margin: auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

.chat-header {
    background: white;
    padding: 14px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #e8eeff;
    color: var(--blue);
    display: grid;
    place-items: center;
    font-weight: 700;
}

.person {
    font-size: 16px;
    font-weight: 700;
}

.presence {
    font-size: 12px;
    margin-top: 5px;
    color: var(--muted);
}

.online {
    color: #16a34a;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.date {
    align-self: center;
    font-size: 11px;
    color: var(--muted);
    background: #e1e7f0;
    padding: 6px 13px;
    border-radius: 30px;
    margin: 10px 0;
}

.message {
    max-width: 75%;
    min-width: 85px;
    padding: 11px 15px 8px;
    border-radius: 15px;
    background: white;
    align-self: flex-start;
    box-shadow: 0 2px 5px #17255408;
    overflow-wrap: anywhere;
}

.message.own {
    align-self: flex-end;
    background: var(--blue);
    color: white;
    border-bottom-right-radius: 4px;
}

.message.other {
    border-bottom-left-radius: 4px;
}

.message-text {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
}

.meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 10px;
    color: #94a3b8;
}

.own .meta {
    color: #dbeafe;
}

.receipt {
    font-size: 13px;
}

.receipt.read {
    color: #a5f3fc;
}

.composer {
    background: white;
    border-top: 1px solid var(--border);
    padding: 10px 15px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
}

.emojis {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 3px 0 10px;
}

.emoji {
    background: #f1f5f9;
    border: 0;
    min-width: 36px;
    height: 36px;
    border-radius: 8px;
    font-size: 21px;
}

.emoji:hover {
    background: #dbeafe;
}

.input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    outline: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font: inherit;
    height: 46px;
    max-height: 120px;
}

textarea:focus {
    border-color: var(--blue);
}

.send {
    background: var(--blue);
    color: white;
    border: 0;
    border-radius: 12px;
    width: 48px;
    height: 46px;
    font-size: 22px;
}

.more-emoji {
    border: 0;
    background: #f1f5f9;
    border-radius: 10px;
    width: 40px;
    height: 46px;
    font-size: 23px;
}

.emoji-panel {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    margin-bottom: 10px;
    background: #f8fafc;
    padding: 10px;
    border-radius: 12px;
}

.hidden {
    display: none !important;
}

.typing {
    padding: 3px 20px 7px;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
}

.status {
    font-size: 11px;
    text-align: center;
    color: var(--muted);
    padding: 5px;
}

.error {
    color: #b91c1c;
}

.empty {
    text-align: center;
    margin: auto;
    color: var(--muted);
    font-size: 14px;
}

@media (max-width: 600px) {
    header {
        padding: 12px 14px;
    }

    .messages {
        padding: 14px 10px;
    }

    .message {
        max-width: 87%;
    }

    .composer {
        padding-left: 8px;
        padding-right: 8px;
    }

    .emoji-panel {
        grid-template-columns: repeat(6, 1fr);
    }

    .chat-header {
        padding: 10px 14px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="brand">
        🎓 ExamPrep Studio
        <small>Teacher Communication</small>
    </div>
    <a id="back" class="back" href="index.html">
        ← Dashboard
    </a>
</header>

<div class="chat-header">
    <div class="avatar" id="avatar">T</div>
    <div>
        <div class="person" id="person">Teacher</div>
        <div class="presence" id="presence">Connecting...</div>
    </div>
</div>

<div id="messages" class="messages">
    <div class="empty">Loading conversation...</div>
</div>

<div id="typing" class="typing hidden"></div>

<div class="composer">

    <div id="quickEmojis" class="emojis"></div>

    <div id="emojiPanel" class="emoji-panel hidden"></div>

    <form id="messageForm" class="input-row">

        <button id="emojiToggle"
            class="more-emoji"
            type="button"
            aria-label="More emojis">😊</button>

        <textarea id="messageInput"
            placeholder="Write a message..."
            maxlength="4000"
            aria-label="Message"></textarea>

        <button id="send"
            class="send"
            type="submit"
            aria-label="Send message"
            disabled>➤</button>

    </form>

    <div class="status" id="status">
        Connecting to chat...
    </div>

</div>
</div>

<script>
"use strict";

const SUPABASE_URL =
    "https://dfepopppcggzecdxexeh.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZXBvcHBwY2dnemVjZHhleGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDY5ODcsImV4cCI6MjEwOTA4Mjk4N30.yNIrIx4jST4zDjqs0TZ56tDEl8NRQOGrJyxmfRnKBDo";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const TABLE = "eps2_teacher_messages";
const $ = id => document.getElementById(id);

const roleParam = new URLSearchParams(
    location.search
).get("teacher");

const me = roleParam === "1" ? "teacher1" :
           roleParam === "2" ? "teacher2" : null;

const other = me === "teacher1"
    ? "teacher2"
    : "teacher1";

const otherName = other === "teacher1"
    ? "Teacher 1"
    : "Teacher 2";

let sending = false;
let refreshing = false;
let refreshAgain = false;
let typingTimer;
let lastTyping = 0;
let channel = null;
let records = [];

function setStatus(text, error = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", error);
}

function updateSend() {
    $("send").disabled =
        !me ||
        sending ||
        !$("messageInput").value.trim();
}

function scrollBottom() {
    $("messages").scrollTop =
        $("messages").scrollHeight;
}

function insertEmoji(emoji) {
    const input = $("messageInput");
    const start = input.selectionStart;
    const end = input.selectionEnd;

    input.setRangeText(emoji, start, end, "end");
    input.focus();
    updateSend();
    notifyTyping();
}

const quickEmojis = [
    "👍", "👌", "✅", "🙏",
    "👏", "😊", "😂", "❤️",
    "🔥", "⏳", "❗", "❓"
];

const moreEmojis = [
    "😀", "😃", "😄", "😁",
    "😅", "😂", "🙂", "😉",
    "😍", "🤔", "😎", "😴",
    "😮", "😢", "😬", "🤝",
    "💪", "🙌", "💯", "🎉",
    "⭐", "📚", "📝", "🖨️",
    "⏰", "📌", "💬", "🚀",
    "👀", "🏆", "💡", "🎯"
];

function renderEmojis(list, target) {
    list.forEach(emoji => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "emoji";
        button.textContent = emoji;

        button.addEventListener("click", () => {
            insertEmoji(emoji);
        });

        $(target).append(button);
    });
}

renderEmojis(quickEmojis, "quickEmojis");
renderEmojis(moreEmojis, "emojiPanel");

$("emojiToggle").addEventListener("click", () => {
    $("emojiPanel").classList.toggle("hidden");
});

function renderMessages() {
    const container = $("messages");

    const nearBottom =
        container.scrollHeight -
        container.scrollTop -
        container.clientHeight < 150;

    container.replaceChildren();

    if (!records.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Start your conversation 👋";
        container.append(empty);
        return;
    }

    let previousDate = "";

    records.forEach(record => {
        const date = new Date(record.created_at);

        const dateLabel = date.toLocaleDateString(
            undefined,
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

        if (dateLabel !== previousDate) {
            const divider = document.createElement("div");
            divider.className = "date";
            divider.textContent = dateLabel;
            container.append(divider);
            previousDate = dateLabel;
        }

        const own = record.sender === me;
        const bubble = document.createElement("div");

        bubble.className = "message " +
            (own ? "own" : "other");

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = record.message;

        const meta = document.createElement("div");
        meta.className = "meta";

        const time = document.createElement("span");
        time.textContent = date.toLocaleTimeString(
            undefined,
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        );

        meta.append(time);

        if (own) {
            const receipt = document.createElement("span");

            receipt.className = "receipt" +
                (record.read_at ? " read" : "");

            receipt.textContent =
                record.read_at ? "✓✓" : "✓";

            receipt.title =
                record.read_at ? "Read" : "Sent";

            meta.append(receipt);
        }

        bubble.append(text, meta);
        container.append(bubble);
    });

    if (nearBottom) scrollBottom();
}

async function markRead() {
    if (document.visibilityState !== "visible") return;
    if (!document.hasFocus()) return;

    const ids = records
        .filter(r => r.receiver === me && !r.read_at)
        .map(r => r.id);

    for (let i = 0; i < ids.length; i += 100) {
        const { error } = await db
            .from(TABLE)
            .update({ read_at: new Date().toISOString() })
            .in("id", ids.slice(i, i + 100))
            .eq("receiver", me)
            .is("read_at", null);

        if (error) {
            setStatus(error.message, true);
            break;
        }
    }
}

async function loadMessages() {
    if (!me) return;

    if (refreshing) {
        refreshAgain = true;
        return;
    }

    refreshing = true;

    try {
        const all = [];
        let cursor = 0;

        while (true) {
            const { data, error } = await db
                .from(TABLE)
                .select("*")
                .gt("id", cursor)
                .order("id", { ascending: true })
                .limit(500);

            if (error) throw error;

            all.push(...data);

            if (data.length < 500) break;

            cursor = data[data.length - 1].id;
        }

        records = all;
        renderMessages();
        setStatus("Conversation loaded");

        await markRead();

    } catch (error) {
        setStatus(error.message, true);
    } finally {
        refreshing = false;

        if (refreshAgain) {
            refreshAgain = false;
            loadMessages();
        }
    }
}

async function sendMessage(event) {
    event.preventDefault();

    const text = $("messageInput").value.trim();

    if (!me || !text || sending) return;

    sending = true;
    updateSend();

    try {
        const { error } = await db
            .from(TABLE)
            .insert({
                sender: me,
                receiver: other,
                message: text
            });

        if (error) throw error;

        if ($("messageInput").value.trim() === text) {
            $("messageInput").value = "";
        }

        $("emojiPanel").classList.add("hidden");

        await loadMessages();
        scrollBottom();

    } catch (error) {
        setStatus("Send failed: " + error.message, true);
    } finally {
        sending = false;
        updateSend();
        $("messageInput").focus();
    }
}

function notifyTyping() {
    if (!channel || !me) return;

    const now = Date.now();

    if (now - lastTyping < 1000) return;

    lastTyping = now;

    channel.send({
        type: "broadcast",
        event: "typing",
        payload: { sender: me }
    });
}

$("messageForm").addEventListener("submit", sendMessage);

$("messageInput").addEventListener("input", () => {
    updateSend();
    notifyTyping();
});

$("messageInput").addEventListener("keydown", event => {
    if (event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing) {
        event.preventDefault();
        $("messageForm").requestSubmit();
    }
});

function connectRealtime() {
    channel = db.channel("eps2-teacher-chat", {
        config: {
            presence: { key: me }
        }
    });

    channel.on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: TABLE
        },
        () => loadMessages()
    );

    channel.on("presence", {
        event: "sync"
    }, () => {
        const state = channel.presenceState();
        const online = Boolean(state[other]?.length);

        $("presence").textContent =
            online ? "● Online in chat" : "Not in chat";

        $("presence").classList.toggle("online", online);
    });

    channel.on(
        "broadcast",
        { event: "typing" },
        ({ payload }) => {
            if (payload.sender !== other) return;

            $("typing").textContent =
                otherName + " is typing...";

            $("typing").classList.remove("hidden");

            clearTimeout(typingTimer);

            typingTimer = setTimeout(() => {
                $("typing").classList.add("hidden");
            }, 2500);
        }
    );

    channel.subscribe(async status => {
        if (status === "SUBSCRIBED") {
            await channel.track({ teacher: me });
            await loadMessages();
        } else if (
            status === "CHANNEL_ERROR" ||
            status === "TIMED_OUT" ||
            status === "CLOSED"
        ) {
            $("presence").textContent = "Reconnecting...";
            $("presence").classList.remove("online");
            setStatus("Realtime unavailable; checking periodically");
        }
    });
}

async function initialize() {
    if (!me) {
        $("person").textContent = "Choose teacher";
        $("presence").textContent = "";

        $("messages").replaceChildren();

        ["1", "2"].forEach(role => {
            const link = document.createElement("a");
            link.href = "chat.html?teacher=" + role;
            link.textContent = "Open as Teacher " + role;
            link.className = "back";
            link.style.background = "#3156d9";
            $("messages").append(link);
        });

        $("messageInput").disabled = true;
        setStatus("Select your teacher workspace");
        return;
    }

    $("person").textContent = otherName;
    $("avatar").textContent =
        other === "teacher1" ? "T1" : "T2";

    $("back").href = me === "teacher1"
        ? "teacher.html"
        : "academic-support.html";

    await loadMessages();
    scrollBottom();

    connectRealtime();

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadMessages();
    });

    window.addEventListener("focus", loadMessages);

    // Fallback when the Realtime connection is interrupted.
    setInterval(loadMessages, 15000);
}

initialize();
</script>

</body>
</html>
