<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | ExamPrep Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff3f9;color:#172554;font:14px Inter,Arial,sans-serif}.app{height:100vh;height:100dvh;display:flex;flex-direction:column}.messages{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.date{align-self:center;background:#e1e7f0;color:#64748b;border-radius:20px;padding:5px 12px;font-size:11px}.bubble{align-self:flex-start;background:white;padding:11px 15px 8px;border-radius:15px 15px 15px 4px;max-width:78%;min-width:70px;overflow-wrap:anywhere}.own{align-self:flex-end;background:#3156d9;color:white;border-radius:15px 15px 4px 15px}.text{white-space:pre-wrap;line-height:1.5}.meta{text-align:right;font-size:10px;color:#64748b;margin-top:6px}.own .meta{color:#dbeafe}.composer{background:white;border-top:1px solid #e2e8f0;padding:10px 15px max(12px,env(safe-area-inset-bottom))}.emojis{display:flex;gap:6px;overflow:auto;padding-bottom:9px}button{font:inherit;cursor:pointer;border:0;border-radius:8px}button:disabled{opacity:.45;cursor:default}.emoji{background:#f1f5f9;min-width:36px;height:36px;font-size:21px}.panel{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding-bottom:10px;max-width:420px}.row{display:flex;gap:8px;align-items:flex-end}textarea{flex:1;min-width:0;resize:none;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit;height:46px;outline:none}textarea:focus{border-color:#3156d9}.send{background:#3156d9;color:white;width:48px;height:46px;font-size:22px}.more{background:#f1f5f9;width:40px;height:46px;font-size:22px}.error{color:#b91c1c;font-size:12px;padding:6px 0}.hidden,[hidden]{display:none!important}@media(max-width:600px){.messages{padding:12px}.bubble{max-width:88%}.composer{padding-left:8px;padding-right:8px}.panel{grid-template-columns:repeat(6,1fr)}}
.photo{display:block;max-width:100%;width:320px;max-height:340px;object-fit:contain;border-radius:9px;cursor:zoom-in;margin-bottom:6px}.preview{display:flex;align-items:center;gap:12px;padding:8px}.preview img{width:90px;height:70px;object-fit:contain}.preview button{padding:8px}.viewer{border:0;background:#111827;padding:12px;max-width:95vw;max-height:95vh;border-radius:12px}.viewer img{display:block;max-width:85vw;max-height:80vh;object-fit:contain}.viewer button{display:block;margin-left:auto;padding:8px;margin-bottom:8px}.viewer::backdrop{background:#000b}</style>
</head>
<body>
<main class="app">
<div id="messages" class="messages" aria-label="Conversation"></div>
<div id="composer" class="composer" hidden>
<div id="quick" class="emojis"></div>
<div id="panel" class="panel" hidden></div>
<div id="preview" class="preview" hidden><img id="previewImage" alt="Selected photo"><span>Photo ready</span><button id="removePhoto" type="button">Remove</button></div><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><form id="form" class="row"><button type="button" id="more" class="more" aria-label="More emojis">😊</button><button id="attach" class="more" type="button" aria-label="Attach photo">📎</button><textarea id="input" maxlength="4000" placeholder="Write a message..." aria-label="Message"></textarea><button id="send" class="send" type="submit" aria-label="Send message" disabled>➤</button></form>
<div id="error" class="error" role="status" hidden></div>
</div>
</main><dialog id="viewer" class="viewer"><button id="closeViewer" type="button">Close ×</button><img id="largePhoto" alt="Chat photo"></dialog>
<script>
'use strict';
const URL_BASE='https://dfepopppcggzecdxexeh.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZXBvcHBwY2dnemVjZHhleGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDY5ODcsImV4cCI6MjEwOTA4Mjk4N30.yNIrIx4jST4zDjqs0TZ56tDEl8NRQOGrJyxmfRnKBDo';
const TABLE='eps2_teacher_messages';
const $=id=>document.getElementById(id);
const role=new URLSearchParams(location.search).get('teacher');
const me=role==='1'?'teacher1':role==='2'?'teacher2':null;
const other=me==='teacher1'?'teacher2':'teacher1';
let db,records=[],sending=false,loading=false,again=false,first=true;
function error(text=''){$('error').textContent=text;$('error').hidden=!text;}
const BUCKET='eps2-chat-photos';
let photo=null, previewURL='', preparing=false, photoVersion=0;
function clearPhoto(){photoVersion++;photo=null;preparing=false;if(previewURL)URL.revokeObjectURL(previewURL);previewURL='';$('preview').hidden=true;$('previewImage').removeAttribute('src');$('file').value='';updateSend();}
async function choosePhoto(file){if(!file||sending)return;clearPhoto();const version=photoVersion;preparing=true;updateSend();try{if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP image.');if(file.size>25*1024*1024)throw Error('Original image exceeds 25 MB.');const bitmap=await createImageBitmap(file);let result=file;try{if(Math.max(bitmap.width,bitmap.height)>2000||file.size>5*1024*1024){const scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);result=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',0.85));}}finally{bitmap.close();}if(!result||result.size>5*1024*1024)throw Error('Photo exceeds 5 MB after compression.');if(version!==photoVersion)return;photo=result;previewURL=URL.createObjectURL(photo);$('previewImage').src=previewURL;$('preview').hidden=false;error();}catch(e){if(version===photoVersion)error(e.message);}finally{if(version===photoVersion){preparing=false;updateSend();}}}
function updateSend(){$('send').disabled=!db||sending||preparing||(!photo&&!$('input').value.trim());}
function bottom(){$('messages').scrollTop=$('messages').scrollHeight;}
function node(tag,cls,text){const n=document.createElement(tag);n.className=cls;n.textContent=text;return n;}
function render(){const box=$('messages');const near=box.scrollHeight-box.scrollTop-box.clientHeight<150;const old=box.scrollTop;const frag=document.createDocumentFragment();let day='';for(const r of records){const d=new Date(r.created_at);const label=d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});if(label!==day){frag.append(node('div','date',label));day=label;}const own=r.sender===me;const b=node('div','bubble'+(own?' own':''),'');if(r.image_path&&/^teacher[12]\/[a-f0-9-]+\.(jpg|png|webp)$/.test(r.image_path)){const img=node('img','photo','');img.alt='Photo attachment';img.src=db.storage.from(BUCKET).getPublicUrl(r.image_path).data.publicUrl;img.onclick=()=>{$('largePhoto').src=img.src;$('viewer').showModal();};img.onload=()=>{if(near||first)bottom();};b.append(img);}if(r.message)b.append(node('div','text',r.message));b.append(node('div','meta',d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:false})+(own?(r.read_at?' ✓✓':' ✓'):'')));frag.append(b);}box.replaceChildren(frag);if(first||near)bottom();else box.scrollTop=old;first=false;}
async function markRead(){if(document.hidden||!document.hasFocus())return;const ids=records.filter(r=>r.receiver===me&&!r.read_at).map(r=>r.id);for(let i=0;i<ids.length;i+=100){const {error:e}=await db.from(TABLE).update({read_at:new Date().toISOString()}).in('id',ids.slice(i,i+100)).eq('receiver',me).is('read_at',null);if(e)throw e;}}
async function load(){if(!db)return;if(loading){again=true;return;}loading=true;try{let all=[],cursor=0;while(true){const {data,error:e}=await db.from(TABLE).select('*').gt('id',cursor).order('id',{ascending:true}).limit(500);if(e)throw e;all.push(...data);if(data.length<500)break;cursor=data[data.length-1].id;}records=all;render();await markRead();error();}catch(e){error(e.message);}finally{loading=false;if(again){again=false;load();}}}
function addEmojis(id,list){for(const emoji of list){const b=node('button','emoji',emoji);b.type='button';b.setAttribute('aria-label','Insert '+emoji);b.onclick=()=>{const input=$('input');if(input.value.length-(input.selectionEnd-input.selectionStart)+emoji.length>4000)return;input.setRangeText(emoji,input.selectionStart,input.selectionEnd,'end');input.focus();updateSend();};$(id).append(b);}}
async function send(event){event.preventDefault();const text=$('input').value.trim();if(!db||(!text&&!photo)||sending||preparing)return;sending=true;updateSend();$('attach').disabled=true;$('removePhoto').disabled=true;try{let path=null;if(photo){const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[photo.type];if(!ext)throw Error('Unsupported image format');path=me+'/'+crypto.randomUUID()+'.'+ext;const {error:e}=await db.storage.from(BUCKET).upload(path,photo,{contentType:photo.type,upsert:false});if(e)throw e;}const {error:e}=await db.from(TABLE).insert({sender:me,receiver:other,message:text,image_path:path});if(e)throw e;if($('input').value.trim()===text)$('input').value='';clearPhoto();$('panel').hidden=true;await load();bottom();}catch(e){error('Send failed: '+e.message);}finally{sending=false;$('attach').disabled=false;$('removePhoto').disabled=false;updateSend();$('input').focus();}}
function init(){if(!me)return;$('composer').hidden=false;$('attach').onclick=()=>$('file').click();$('file').onchange=()=>choosePhoto($('file').files[0]);$('removePhoto').onclick=clearPhoto;$('closeViewer').onclick=()=>$('viewer').close();document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(i=>i.kind==='file'&&i.type.startsWith('image/'));if(item&&!sending){e.preventDefault();choosePhoto(item.getAsFile());}});addEmojis('quick',['👍','👌','✅','🙏','👏','😊','😂','❤️','🔥','⏳','❗','❓']);addEmojis('panel',['😀','😃','😄','😁','😅','😂','🙂','😉','😍','🤔','😎','😴','😮','😢','😬','🤝','💪','🙌','💯','🎉','⭐','📚','📝','🖨️','⏰','📌','💬','🚀','👀','🏆','💡','🎯']);$('more').onclick=()=>{$('panel').hidden=!$('panel').hidden;};$('input').addEventListener('input',updateSend);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit();}});$('form').addEventListener('submit',send);if(!window.supabase){error('Unable to load chat library. Refresh the page.');return;}db=window.supabase.createClient(URL_BASE,KEY);db.channel('eps2-teacher-chat').on('postgres_changes',{event:'*',schema:'public',table:TABLE},load).subscribe(s=>{if(s==='SUBSCRIBED')load();});load();window.addEventListener('focus',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});setInterval(load,15000);updateSend();}
init();
</script>
</body>
</html>
