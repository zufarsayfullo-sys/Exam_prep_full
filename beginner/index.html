<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beginner Quizzes · ExamPrep Studio</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172554;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:#172554;color:white;padding:20px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:white;text-decoration:none;font-size:14px}.brand{font-weight:800;letter-spacing:-.5px}main{max-width:1050px;margin:auto;padding:48px 22px 80px}.eyebrow{font-size:12px;color:#536caa;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.5px;margin:12px 0}p{color:#68758c;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}.search{border:1px solid #dce3ef;background:white;border-radius:14px;padding:14px 16px;font:inherit;width:min(100%,310px);outline:none}.search:focus{border-color:#365ac3;box-shadow:0 0 0 3px #365ac31c}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.quiz{background:white;border:1px solid #e3e8f2;border-radius:18px;padding:22px;box-shadow:0 8px 28px #15265408;display:flex;flex-direction:column;gap:15px}.quiz:hover{border-color:#b6c5e6;transform:translateY(-2px);transition:.2s}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.num{font-size:12px;font-weight:700;color:#8090ac}.tag{border-radius:50px;padding:6px 10px;font-size:11px;font-weight:800;background:#e9efff;color:#3155b7}.tag.vocabulary{background:#e5f7ef;color:#15734d}.quiz h2{font-size:20px;line-height:1.35;letter-spacing:-.4px;margin:0}.meta{color:#7c8aa3;font-size:13px}.open{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;background:#2547b4;color:white;text-decoration:none;font-size:14px;font-weight:750;padding:12px 16px;margin-top:auto}.open:hover{background:#19368e}.open.disabled{background:#e7ebf4;color:#8996ac;pointer-events:none}.state{grid-column:1/-1;text-align:center;padding:50px 20px;background:white;border:1px dashed #ccd6e6;border-radius:18px;color:#67758f}.state strong{display:block;color:#172554;margin-bottom:8px}.footer{font-size:12px;text-align:center;color:#91a0b8;margin-top:42px}@media(max-width:600px){header{padding:17px 20px}main{padding:32px 18px 60px}.top{align-items:stretch}.search{width:100%}}
</style>
</head>
<body>
<header><div class="brand">✦ ExamPrep Studio</div><a href="../index.html">← All levels</a></header>
<main>
<div class="top"><div><div class="eyebrow">Level 01 · Learning library</div><h1>Beginner Quizzes</h1><p>Choose a quiz and practise at your own pace.</p></div><input class="search" id="search" type="search" placeholder="Search quizzes..." aria-label="Search quizzes"></div>
<section id="list" class="list" aria-live="polite"><div class="state">Loading quizzes…</div></section>
<div class="footer">ExamPrep Studio · Beginner</div>
</main>
<script>
const list=document.getElementById('list'), search=document.getElementById('search');let quizzes=[];
function render(){const term=search.value.trim().toLowerCase();const shown=quizzes.filter(q=>[q.title,q.category,q.description].join(' ').toLowerCase().includes(term));if(!shown.length){list.innerHTML='<div class="state"><strong>No quizzes found</strong>Try another search or add a quiz to the JSON index.</div>';return;}list.replaceChildren(...shown.map((q,i)=>{const card=document.createElement('article');card.className='quiz';const top=document.createElement('div');top.className='row';const num=document.createElement('span');num.className='num';num.textContent='QUIZ '+String(i+1).padStart(2,'0');const tag=document.createElement('span');tag.className='tag '+(String(q.category).toLowerCase()==='vocabulary'?'vocabulary':'');tag.textContent=q.category||'Quiz';top.append(num,tag);const title=document.createElement('h2');title.textContent=q.title||'Untitled quiz';const meta=document.createElement('div');meta.className='meta';meta.textContent=[Number.isFinite(q.questionCount)?`${q.questionCount} questions`:null,q.description].filter(Boolean).join(' · ');const link=document.createElement('a');link.className='open'+(!q.url?' disabled':'');link.textContent=q.url?'Open Quiz →':'Coming soon';if(q.url){const url=new URL(q.url,location.href);if(url.origin===location.origin&&['http:','https:'].includes(url.protocol))link.href=url.href;else{link.className='open disabled';link.textContent='Unavailable';}}card.append(top,title,meta,link);return card;}));}
search.addEventListener('input',render);
(async()=>{try{const res=await fetch('./quizzes/index.json',{cache:'no-store'});if(!res.ok)throw Error('Quiz list unavailable');const data=await res.json();if(!Array.isArray(data))throw Error('Quiz list must be an array');quizzes=data;render();}catch(e){list.innerHTML='';const state=document.createElement('div');state.className='state';const strong=document.createElement('strong');strong.textContent='Unable to load quiz list';const hint=document.createElement('span');hint.textContent='Make sure beginner/quizzes/index.json is uploaded. Open this page through GitHub Pages, not as a local file.';state.append(strong,hint);list.append(state);}})();
</script>
</body></html>
