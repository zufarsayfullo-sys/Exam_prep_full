<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Board | ExamPrep Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#192044;background:#f5f5fc}*{box-sizing:border-box}body{margin:0}.page{max-width:510px;margin:0 auto;padding:32px 18px}.brand{font-size:23px;font-weight:850;margin-bottom:40px}.brand span{color:#7238eb}.card{background:#fff;border:1px solid #e9e5f6;border-radius:24px;box-shadow:0 14px 44px #30235c0b;padding:30px}.eyebrow{font-size:12px;font-weight:800;color:#7138e5;letter-spacing:.1em}.tag{display:inline-block;background:#f1ebff;color:#6d34db;border-radius:40px;padding:7px 12px;font-size:12px;font-weight:750}h1{font-size:32px;line-height:1.15;margin:14px 0}p{line-height:1.6}.muted{color:#71788d}.state{padding:15px;border-radius:12px;background:#f5f0ff;color:#50318b;margin:24px 0}label{display:block;font-weight:700;margin:20px 0 9px}input{width:100%;font:inherit;padding:14px;border:1px solid #d9d6e7;border-radius:12px;outline-color:#7138e5}button{width:100%;border:0;border-radius:12px;padding:15px;background:#7138e5;color:#fff;font:inherit;font-weight:750;cursor:pointer;margin-top:17px}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}#error{color:#bc2441;min-height:22px;margin-top:14px;font-size:14px}.foot{text-align:center;color:#8d90a2;font-size:12px;margin-top:25px}.spinner{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8655f0;margin-right:7px}
</style></head><body><main class="page"><header class="brand">✦ ExamPrep <span>Studio</span></header><section class="card"><span class="tag">Student Board</span><div id="empty"><h1>Ready to learn?</h1><p class="muted">Waiting for your teacher to select a live quiz.</p><div class="state"><span class="spinner"></span> Checking for an active quiz…</div></div><div id="active" class="hidden"><div class="eyebrow">ACTIVE QUIZ</div><h1 id="title"></h1><p class="muted" id="details"></p><div class="state" id="status"></div><form id="joinForm"><label for="name">Your full name</label><input id="name" maxlength="80" minlength="2" required autocomplete="name" placeholder="e.g. Ali Karimov"><button id="joinBtn" type="submit">Enter Quiz →</button></form></div><p id="error" role="alert"></p></section><div class="foot">ExamPrep Studio · Live classroom</div></main><script>
const URL_BASE='https://dfepopppcggzecdxexeh.supabase.co';const PUBLIC_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZXBvcHBwY2dnemVjZHhleGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDY5ODcsImV4cCI6MjEwOTA4Mjk4N30.yNIrIx4jST4zDjqs0TZ56tDEl8NRQOGrJyxmfRnKBDo";
const $=id=>document.getElementById(id);let active=null,busy=false;
async function rpc(fn,data={}){const r=await fetch(URL_BASE+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:PUBLIC_KEY,Authorization:'Bearer '+PUBLIC_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});const t=await r.text();let o;try{o=JSON.parse(t)}catch{o=t}if(!r.ok)throw Error(o?.message||String(o));return o}
async function refresh(){if(busy)return;try{const d=await rpc('eps2_active');active=d&&d.code?d:null;$('empty').classList.toggle('hidden',!!active);$('active').classList.toggle('hidden',!active);if(active){$('title').textContent=active.title;$('details').textContent='Beginner · Grammar · 10 questions · Pass mark 80%';$('status').textContent=active.status==='waiting'?'Waiting for students · Teacher will start the quiz':'Quiz in progress · Joining is closed';$('joinBtn').disabled=active.status!=='waiting';}else{$('empty').querySelector('.state').textContent='No live quiz yet. This page refreshes automatically.'}$('error').textContent=''}catch(e){$('error').textContent='Cannot load live quiz: '+e.message}}
$('joinForm').addEventListener('submit',async e=>{e.preventDefault();if(!active||busy||active.status!=='waiting')return;busy=true;$('joinBtn').disabled=true;$('error').textContent='';try{const name=$('name').value.trim();const result=await rpc('eps2_join',{p_code:active.code,p_name:name});sessionStorage.setItem('eps2_player',JSON.stringify({code:active.code,playerId:result.player_id}));const path=active.path;if(!/^(beginner|elementary|pre-int|inter|upper-inter)\/quizzes\/[a-zA-Z0-9_-]+\.html$/.test(path))throw Error('Quiz path is not configured correctly');const u=new URL(path,location.href.replace(/[^/]*$/, ''));u.searchParams.set('join',active.code);location.assign(u.href)}catch(err){$('error').textContent=err.message;busy=false;$('joinBtn').disabled=false}});
refresh();setInterval(refresh,4000);
</script></body></html>
