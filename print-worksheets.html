<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Worksheets | ExamPrep Studio</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172554;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}
header{background:#172554;color:white;padding:28px max(20px,calc((100% - 1050px)/2))}header h1{margin:10px 0;font-size:30px}header p{color:#cbd5e1;margin:0}
main{max-width:1050px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:24px;margin-bottom:20px}
.controls{display:grid;grid-template-columns:1fr 1fr 145px;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;font:inherit}
button{background:#4f46e5;color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#eef2ff;color:#3730a3}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.status{font-size:13px;color:#475569;margin:14px 0 0;line-height:1.6;white-space:pre-line}.error{color:#b91c1c}.hidden{display:none!important}
.sheet{background:white;color:#111827;border:1px solid #e2e8f0;border-radius:15px;padding:32px}.sheet h2{text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:#475569;margin-bottom:25px}.student-fields{display:flex;justify-content:space-between;gap:15px;margin-bottom:25px}
.question{break-inside:avoid;margin-bottom:22px;line-height:1.6}.options{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;margin:10px 0 0 22px}
.line{border-bottom:1px dotted #9ca3af;height:24px;margin:8px 0 0 22px}.key{margin-top:28px;border-top:2px dashed #94a3b8;padding-top:18px}
.key-list{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;font-size:13px}footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
@media(max-width:650px){.controls{grid-template-columns:1fr}.sheet{padding:18px}.options{grid-template-columns:1fr}.student-fields{display:block}.student-fields div{margin-bottom:10px}.key-list{grid-template-columns:repeat(2,1fr)}}
@page{size:A4;margin:15mm}@media print{header,.panel,footer{display:none!important}body{background:white}.sheet{border:0;border-radius:0;padding:0}.key{break-before:page}.question{margin-bottom:16px}}
.passive-sentence{margin:9px 0 0 20px;line-height:2.1}.inline-blank{display:inline-block;min-width:165px;white-space:nowrap;letter-spacing:0.3px;color:#334155}@media print{.passive-sentence{break-inside:avoid}.inline-blank{color:#111827}}
.context-reply{margin:8px 0 4px 22px;font-size:15px;line-height:1.5;color:#334155;break-inside:avoid}
@media print{.context-reply{color:#111827}}
</style>
</head>
<body>
<header><strong>✦ ExamPrep Studio</strong><h1>Print Worksheets</h1><p>Create printable worksheets from registered quiz banks.</p></header>
<main>
<section class="panel">
  <div class="controls">
    <div><label for="level">Level</label><select id="level" disabled><option>Loading levels...</option></select></div>
    <div><label for="quiz">Quiz</label><select id="quiz" disabled><option value="">Choose a level</option></select></div>
    <div><label for="count">Questions</label><select id="count"><option value="10">10</option><option value="15">15</option><option value="20">20</option></select></div>
  </div>
  <div class="actions">
    <button id="generate" disabled>Generate worksheet</button>
    <button id="reshuffle" class="secondary" disabled>New random set</button>
    <button id="print" class="secondary" disabled>Print</button>
    <label style="display:flex;align-items:center;gap:8px;margin:0 0 0 auto"><input type="checkbox" id="answerKey">Include answer key</label>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">Loading quiz catalogues...</p>
</section>
<article id="sheet" class="sheet hidden">
  <h2 id="sheetTitle"></h2><p id="sheetSub" class="subtitle"></p>
  <div class="student-fields"><div>Name: ______________________</div><div>Date: ______________</div><div>Score: ____ / <span id="maxScore"></span></div></div>
  <div id="questions"></div>
  <section id="key" class="key"><h3>Answer Key</h3><div id="answers" class="key-list"></div></section>
</article>
</main>
<footer>ExamPrep Studio · Universal Worksheet Generator</footer>
<script>
"use strict";
const LEVELS = [
  ["beginner", "Beginner"],
  ["elementary", "Elementary"],
  ["pre-int", "Pre-Intermediate"],
  ["inter", "Intermediate"],
  ["upper-inter", "Upper-Intermediate"]
];
const $ = id => document.getElementById(id);
const catalog = new Map();
const problems = new Map();
let bank = [];
let selection = [];
let loadedPath = "";
let generationId = 0;
function message(text, isError = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", isError);
}
async function getJSON(path) {
  let response;
  try {
    response = await fetch(path, {cache:"no-store"});
  } catch (error) {
    throw new Error("Network error loading " + path + ": " + error.message);
  }
  if (!response.ok) throw new Error("HTTP " + response.status + " loading " + path);
  try { return await response.json(); }
  catch (error) { throw new Error("Invalid JSON in " + path + ": " + error.message); }
}
function getEntries(index) {
  if (Array.isArray(index)) return index;
  for (const field of ["quizzes", "items", "entries", "data"]) {
    if (Array.isArray(index?.[field])) return index[field];
  }
  throw new Error("Catalogue must be a JSON array or contain a quizzes array");
}
function resolveBank(slug, item, position) {
  // Catalogue entries may be objects, filenames, or labels.
  const raw = typeof item === "string" ? {file:item} : item;
  const obj = raw && typeof raw === "object" ? raw : {};
  const candidates = [obj.bank,obj.bank_file,obj.bankFile,obj.questions_file,
    obj.questionsFile,obj.json,obj.path,obj.file,obj.url,obj.href,obj.quiz,
    obj.id,typeof item === "string" ? item : null];
  let filename = "";
  for (const candidate of candidates) {
    if (typeof candidate !== "string") continue;
    const base = candidate.split(/[?#]/)[0].split("/").pop();
    if (/^quiz[-_]\d+(?:\.bank)?\.(?:json|html)$/i.test(base)) {
      filename = base.replace(/\.html$/i,".bank.json")
        .replace(/^(quiz[-_]\d+)\.json$/i,"$1.bank.json");
      break;
    }
    const match = candidate.match(/(?:quiz[-_]|(?:beginner|elementary)[-_])(\d+)/i);
    if (match) {
      filename = "quiz-" + String(Number(match[1])).padStart(2,"0") + ".bank.json";
      break;
    }
  }
  // When a catalogue supplies only labels, its ordered entries still
  // correspond to quiz-01, quiz-02, etc. Do not silently drop them.
  if (!filename) filename = "quiz-" + String(position + 1).padStart(2,"0") + ".bank.json";
  const fallback = "Quiz " + String(position + 1).padStart(2,"0");
  const label = [obj.title,obj.name,obj.label].find(v=>typeof v==="string" && v.trim()) || fallback;
  return {path:slug + "/quizzes/" + filename,label};
}
async function loadLevel(slug) {
  const path = slug + "/quizzes/index.json";
  try {
    const entries = getEntries(await getJSON(path));
    const unique = new Map();
    for (const [position, entry] of entries.entries()) {
      const quiz = resolveBank(slug, entry, position);
      unique.set(quiz.path, quiz);
    }
    const quizzes = [...unique.values()].sort((a,b) => a.path.localeCompare(b.path, undefined, {numeric:true}));
    // Resolve descriptive titles from each bank when index.json only provides filenames.
    // A missing/invalid bank must NOT remove the quiz from the dropdown.
    await Promise.all(quizzes.map(async quiz => {
      try {
        const data = await getJSON(quiz.path);
        const title = data && typeof data === "object"
          ? (data.title || data.quiz_title || data.name)
          : null;
        if (typeof title === "string" && title.trim()) quiz.label = title.trim();
      } catch (error) {
        console.warn("Quiz title unavailable:", quiz.path, error.message);
      }
    }));
    catalog.set(slug, quizzes);
    problems.set(slug, "");
  } catch (error) {
    catalog.set(slug, []);
    problems.set(slug, error.message);
  }
}
function resetSheet() {
  bank = [];
  selection = [];
  loadedPath = "";
  $("sheet").classList.add("hidden");
  $("generate").disabled = true;
  $("reshuffle").disabled = true;
  $("print").disabled = true;
}
function changeLevel() {
  generationId++;
  resetSheet();
  const slug = $("level").value;
  const quizzes = catalog.get(slug) || [];
  $("quiz").replaceChildren(new Option(quizzes.length ? "Select quiz" : "No quizzes registered", ""), ...quizzes.map((quiz,i) => new Option(quiz.label, String(i))));
  $("quiz").value = quizzes.length ? "0" : "";
  $("generate").disabled = !quizzes.length;
  const issue = problems.get(slug);
  if (issue) message("Catalogue issue for " + slug + ": " + issue, true);
  else if (quizzes.length) message(quizzes.length + " registered quiz(es) in " + slug + ". Select a quiz to generate a worksheet.");
  else message("No quizzes listed in " + slug + "/quizzes/index.json. Add quiz entries to this catalogue.", true);
}
async function initialize() {
  $("level").replaceChildren(...LEVELS.map(([slug,label]) => new Option(label,slug)));
  await Promise.all(LEVELS.map(([slug]) => loadLevel(slug)));
  $("level").disabled = false;
  $("quiz").disabled = false;
  $("level").value = "beginner";
  changeLevel();
  const total = LEVELS.reduce((sum,[slug]) => sum + (catalog.get(slug)?.length || 0), 0);
  const errors = LEVELS.filter(([slug]) => problems.get(slug));
  if (errors.length) console.warn("Catalogue diagnostics:", errors.map(([slug]) => ({level:slug, issue:problems.get(slug)})));
  console.info("Registered quiz total:", total);
}
function extractQuestions(data) {
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") return [];
  for (const key of ["questions","bank","items","data","questionBank","question_bank"]) {
    if (Array.isArray(data[key])) return data[key];
  }
  for (const value of Object.values(data)) {
    if (Array.isArray(value) && value.some(q => q && typeof q === "object" && (q.prompt || q.question || q.text || q.q || q.original || q.originalSentence || q.active || q.given))) return value;
  }
  return [];
}
function normalizeQuestion(q) {
  if (typeof q === "string") return {prompt:q, options:[], answer:""};
  if (!q || typeof q !== "object") return null;
  const pick = (...values) => values.find(v => typeof v === "string" && v.trim()) || "";
  const source = pick(q.original,q.originalSentence,q.original_sentence,q.active,q.activeSentence,q.active_sentence,q.given,q.source,q.sourceSentence,q.source_sentence,q.firstSentence,q.first_sentence);
  const before = pick(q.before,q.prefix,q.start,q.sentenceBefore,q.sentence_before,q.passiveBefore,q.passive_before,q.passivePrefix,q.passive_prefix,q.secondBefore,q.second_before);
  const after = pick(q.after,q.suffix,q.end,q.sentenceAfter,q.sentence_after,q.passiveAfter,q.passive_after,q.passiveSuffix,q.passive_suffix,q.secondAfter,q.second_after);
  const rawPrompt = pick(q.question,q.prompt,q.text,q.q,q.sentence,q.stem);
  const transformation = !!(source && (before || after));
  const prompt = rawPrompt || source || (before + " ___ " + after).trim();
  if (!prompt) return null;
  let options = q.options || q.choices || q.answers || [];
  if (options && !Array.isArray(options) && typeof options === "object") options = Object.values(options);
  options = Array.isArray(options) ? options.map(v => typeof v === "string" ? v : v?.text || v?.label || v?.value || "").filter(Boolean) : [];
  let answer = q.correctAnswer ?? q.correct_answer ?? q.correct ?? q.answer ?? q.key ?? q.expected ?? q.acceptedAnswers?.[0] ?? "";
  if (typeof answer === "number" && options.length) answer = options[answer] ?? String(answer);
  if (typeof answer === "string" && /^[A-D]$/i.test(answer) && options.length) answer = options[answer.toUpperCase().charCodeAt(0)-65] || answer;
  return {prompt, options, answer:String(answer), transformation, source, before, after, reply:pick(q.reply,q.response,q.contextReply,q.context_reply), verb:pick(q.verb,q.baseVerb,q.base_verb)};
}
function randomSample(array, count) {
  const copy = [...array];
  for (let i=copy.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy.slice(0,count);
}
function addElement(tag, value, parent, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  parent.append(element);
  return element;
}
function renderWorksheet() {
  const slug = $("level").value;
  const quiz = catalog.get(slug)?.[Number($("quiz").value)];
  if (!quiz || quiz.path !== loadedPath || !selection.length) return;
  $("sheetTitle").textContent = quiz.label;
  $("sheetSub").textContent = (LEVELS.find(([key])=>key===slug)?.[1] || slug) + " · " + selection.length + " questions";
  $("maxScore").textContent = selection.length;
  $("questions").replaceChildren();
  $("answers").replaceChildren();
  selection.forEach((q,i) => {
    const wrap = addElement("div","",$("questions"),"question");
    if (q.transformation) {
      addElement("strong",(i+1)+". "+q.source,wrap);
      const second = addElement("div","",wrap,"passive-sentence");
      if (q.before) addElement("span",q.before+" ",second);
      addElement("span","____________________________",second,"inline-blank");
      if (q.after) addElement("span"," "+q.after,second);
    } else {
      addElement("strong",(i+1)+". "+q.prompt,wrap);
      if (q.verb) addElement("span"," ("+q.verb+")",wrap,"verb-hint");
      if (q.reply) addElement("div","Reply: "+q.reply,wrap,"context-reply");
      if (q.options.length) {
        const opts = addElement("div","",wrap,"options");
        q.options.forEach((option,j) => addElement("div",String.fromCharCode(65+j)+". "+option,opts));
      } else if (!q.prompt.includes("___") && !q.reply) addElement("div","",wrap,"line");
    }
    addElement("div",(i+1)+". "+(q.answer || "—"),$("answers"));
  });
  $("key").classList.toggle("hidden",!$("answerKey").checked);
  $("sheet").classList.remove("hidden");
  $("print").disabled = false;
  $("reshuffle").disabled = false;
}
function reshuffle() {
  const quiz = catalog.get($("level").value)?.[Number($("quiz").value)];
  if (!bank.length || !quiz || quiz.path !== loadedPath) return;
  selection = randomSample(bank, Math.min(Number($("count").value),bank.length));
  renderWorksheet();
}
async function generateWorksheet() {
  const quiz = catalog.get($("level").value)?.[Number($("quiz").value)];
  if (!quiz) return;
  const current = ++generationId;
  resetSheet();
  message("Loading " + quiz.path + "...");
  try {
    const data = await getJSON(quiz.path);
    if (current !== generationId) return;
    const questions = extractQuestions(data).map(normalizeQuestion).filter(Boolean);
    if (!questions.length) throw new Error("No supported questions found in " + quiz.path + ". Check the question fields in this bank.");
    bank = questions;
    loadedPath = quiz.path;
    reshuffle();
    message("Loaded " + bank.length + " questions from " + quiz.path);
  } catch (error) {
    if (current !== generationId) return;
    resetSheet();
    message("Question bank error: " + error.message,true);
  } finally {
    if (current === generationId) $("generate").disabled = false;
  }
}
$("level").addEventListener("change",changeLevel);
$("quiz").addEventListener("change",() => {
  generationId++;
  resetSheet();
  const selected = $("quiz").value;
  $("generate").disabled = selected === "" || !catalog.get($("level").value)?.[Number(selected)];
  message($("generate").disabled ? "Select a quiz." : "Ready to generate a worksheet.");
});
$("count").addEventListener("change",() => {if (bank.length) reshuffle();});
$("generate").addEventListener("click",generateWorksheet);
$("reshuffle").addEventListener("click",reshuffle);
$("print").addEventListener("click",()=>window.print());
$("answerKey").addEventListener("change",()=>$("key").classList.toggle("hidden",!$("answerKey").checked));
initialize();
</script>
</body>
</html>
