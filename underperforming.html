<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172554"><title>Student Support · ExamPrep Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#172033;font:14px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.wrap{max-width:1600px;margin:auto;padding:0 14px 10px}.top{margin:0 -14px 10px;padding:10px 18px;background:#172554;color:white;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:17px}.brand small{display:block;font-size:10px;color:#c8d2f5;font-weight:400}.right,.toolbar,.tabs,.levels,.filters,.bulkbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.top a,.top button{color:white;background:transparent;border:1px solid #ffffff55;border-radius:6px;padding:5px 9px;text-decoration:none}.toolbar{justify-content:space-between;margin-bottom:7px}.tab,.level,.action{border:1px solid #dce3ef;background:white;color:#172554;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:650}.tab[aria-selected=true],.level[aria-pressed=true]{background:#3156d9;color:white;border-color:#3156d9}.filters{margin-bottom:6px}.field{border:1px solid #dce3ef;border-radius:6px;padding:6px 9px;background:white;min-width:0}.filters input{flex:2}.filters select{flex:1}.bulkbar{margin-bottom:7px;font-size:12px}.selectlabel{display:flex;align-items:center;gap:5px}.bulkcount{color:#667085}.danger{margin-left:auto;color:#b42338;border-color:#f1c5ca}.row-select,#selectAll{accent-color:#3156d9;margin:0;width:14px;height:14px;flex:none}.names{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.record{display:flex;align-items:center;gap:5px;min-width:0;background:white;border:1px solid #e1e6ef;border-radius:7px;padding:5px 6px;min-height:34px}.record-name{flex:1;min-width:0;font-size:12px;font-weight:650;overflow-wrap:anywhere}.iconbtn{display:grid;place-items:center;width:25px;height:25px;flex:none;border:0;background:transparent;border-radius:5px;color:#3156d9;padding:3px}.iconbtn:hover{background:#edf1ff}.iconbtn.resolve{color:#16834b}.iconbtn.reopen{color:#667085}.iconbtn svg{width:17px;height:17px}.detail{position:fixed;z-index:10;background:white;border:1px solid #dce3ef;box-shadow:0 5px 20px #17255422;border-radius:7px;padding:7px 9px;font-size:11px;max-width:min(280px,calc(100vw - 16px));overflow-wrap:anywhere}.detail small{display:block;color:#667085;font-size:10px;margin-top:3px}.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;background:white;border:1px solid #e1e6ef;border-radius:7px;margin-top:8px;padding:7px;font-size:11px;color:#667085}.stat strong{color:#172554;margin-left:5px}.status{font-size:12px;color:#b42338;overflow-wrap:anywhere;margin:5px 0}.status:empty{display:none}.subtle{font-size:10px;color:#667085;margin:5px 0}.empty{padding:18px;text-align:center;color:#667085}@media(max-width:1200px){.names{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:950px){.names{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:750px){.names{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){.names{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:8px}.record{padding:4px}.iconbtn{width:23px}.filters{flex-wrap:nowrap}}</style></head><body><div class="wrap"><header class="top"><div class="brand">✦ ExamPrep Studio<small>Student Support Center</small></div><div class="right"><button id="refresh" type="button" aria-label="Refresh">↻</button><a href="./index.html">Home ↗</a></div></header><section id="dashboard"><div class="toolbar"><div class="tabs" role="tablist" aria-label="Support status"><button class="tab" id="tabPending" role="tab" aria-selected="true">Pending <span id="pendingTabCount"></span></button><button class="tab" id="tabResolved" role="tab" aria-selected="false">Resolved <span id="resolvedTabCount"></span></button></div><div class="levels" id="levelButtons" aria-label="Filter by level"></div><select id="levelFilter" class="hidden" aria-label="Filter by level"><option value="">All levels</option></select></div><div class="filters"><input class="field" id="search" type="search" placeholder="Search student or quiz..." aria-label="Search students"><select class="field" id="quizFilter" aria-label="Filter by quiz"><option value="">All quizzes</option></select></div><div class="bulkbar"><label class="selectlabel"><input id="selectAll" type="checkbox">Select all shown</label><span id="selectedCount" class="bulkcount">0 selected</span><button id="deleteSelected" class="action danger" type="button" disabled>Delete selected</button></div><div id="rows" class="names"></div><div id="empty" class="empty hidden">No matching records</div><p id="dashboardError" class="status" role="status"></p><div class="stats"><div class="stat">Pending <strong id="pendingCount">—</strong></div><div class="stat">Resolved <strong id="resolvedCount">—</strong></div><div class="stat">Avg. failed score <strong id="average">—</strong></div></div><p class="subtle">Shared dashboard — no sign-in. Anyone with access may view and change records. Original scores are retained when resolved.</p></section></div><script>
'use strict';
const SUPABASE_URL='https://dfepopppcggzecdxexeh.supabase.co';
// Public anon key from the working ExamPrep live quiz (same Supabase project).
const PUBLIC_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmZXBvcHBwY2dnemVjZHhleGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDY5ODcsImV4cCI6MjEwOTA4Mjk4N30.yNIrIx4jST4zDjqs0TZ56tDEl8NRQOGrJyxmfRnKBDo';
const $=id=>document.getElementById(id);
let records=[],tab='pending',working=false;
const selectedIds=new Set();
let visibleIds=[];
const ready=()=>PUBLIC_KEY&&!PUBLIC_KEY.startsWith('PASTE_');
async function rpc(name,body={}){
 const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{
  method:'POST',
  headers:{apikey:PUBLIC_KEY,Authorization:'Bearer '+PUBLIC_KEY,'Content-Type':'application/json'},
  body:JSON.stringify(body)
 });
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!res.ok)throw Error(data?.message||data?.error||`HTTP ${res.status}`);
 return data;
}
function message(id,text){$(id).textContent=text||''}
async function load(){
 message('dashboardError','');
 if(!ready()){message('dashboardError','Add the matching Supabase public key in this HTML first.');return}
 try{const data=await rpc('eps2_support_list');records=Array.isArray(data)?data:[];const existing=new Set(records.map(r=>String(r.id)));for(const id of selectedIds)if(!existing.has(id))selectedIds.delete(id);render()}
 catch(e){message('dashboardError',e.message)}
}
function dateText(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node}
function actionButton(r){const b=el('button',r.support_status==='resolved'?'↶ Reopen Issue':'✓ Mark as Resolved','action');b.type='button';b.disabled=working;b.addEventListener('click',()=>changeStatus(r));return b}
async function changeStatus(r){if(working)return;const next=r.support_status==='resolved'?'pending':'resolved';if(!confirm(`${next==='resolved'?'Mark as resolved':'Reopen'} the issue for ${r.student_name}?`))return;working=true;message('dashboardError','');render();try{await rpc('eps2_support_set_status',{p_id:r.id,p_status:next});await load()}catch(e){message('dashboardError',e.message)}finally{working=false;render()}}
function selectionCheckbox(r){
 const input=document.createElement('input');input.type='checkbox';input.className='row-select';input.setAttribute('aria-label','Select '+(r.student_name||'student'));
 input.checked=selectedIds.has(String(r.id));input.disabled=working;
 input.addEventListener('change',()=>{const id=String(r.id);if(input.checked)selectedIds.add(id);else selectedIds.delete(id);render()});return input;
}
function updateSelectionControls(){
 const visible=new Set(visibleIds),selectedVisible=visibleIds.filter(id=>selectedIds.has(id));
 const all=$('selectAll');all.checked=visibleIds.length>0&&selectedVisible.length===visibleIds.length;
 all.indeterminate=selectedVisible.length>0&&selectedVisible.length<visibleIds.length;
 all.disabled=working||visibleIds.length===0;
 $('selectedCount').textContent=selectedVisible.length+' selected'+(selectedIds.size>selectedVisible.length?' ('+selectedIds.size+' across filters)':'');
 $('deleteSelected').disabled=working||selectedIds.size===0;
 $('deleteSelected').textContent=working?'Working…':'Delete selected'+(selectedIds.size?' ('+selectedIds.size+')':'');
}
async function deleteSelected(){
 if(working||!selectedIds.size)return;
 const ids=[...selectedIds];
 if(!confirm('PERMANENTLY DELETE '+ids.length+' selected support record(s) from Supabase?\n\nThis cannot be undone.'))return;
 working=true;message('dashboardError','');render();
 try{
  const result=await rpc('eps2_support_delete',{p_ids:ids});
  selectedIds.clear();await load();
  message('dashboardError','Deleted '+(typeof result==='number'?result:ids.length)+' record(s) permanently.');
 }catch(e){message('dashboardError','Deletion failed: '+e.message+' — Run the supplied Supabase SQL setup if the function is missing.');}
 finally{working=false;render()}
}
function updateQuizFilter(){const current=$('quizFilter').value;const names=[...new Set(records.map(r=>r.quiz_name||'Unknown quiz'))].sort((a,b)=>a.localeCompare(b));$('quizFilter').replaceChildren(new Option('All quizzes',''),...names.map(n=>new Option(n,n)));$('quizFilter').value=names.includes(current)?current:''}
function levelName(r){
 const raw=String(r.quiz_level||'').trim().toLowerCase();
 return ({beginner:'Beginner',elementary:'Elementary','pre-int':'Pre-Intermediate','pre-intermediate':'Pre-Intermediate',inter:'Intermediate',intermediate:'Intermediate','upper-inter':'Upper-Intermediate','upper-intermediate':'Upper-Intermediate'})[raw]|| (raw ? r.quiz_level : 'Not specified');
}
const levelOptions=[['','All'],['Beginner','B'],['Elementary','E'],['Pre-Intermediate','PI'],['Intermediate','I'],['Upper-Intermediate','UI']];
function updateLevelFilter(){const selected=$('levelFilter').value;const options=[...levelOptions];for(const name of new Set(records.map(levelName)))if(!options.some(x=>x[0]===name))options.push([name,name]);$('levelFilter').replaceChildren(...options.map(([v,l])=>new Option(l,v)));$('levelFilter').value=options.some(x=>x[0]===selected)?selected:'';$('levelButtons').replaceChildren(...options.map(([v,l])=>{const b=el('button',l,'level');b.type='button';b.title=v||'All levels';b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',String($('levelFilter').value===v));b.onclick=()=>{$('levelFilter').value=v;render()};return b}));}
const icons={eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',resolve:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',reopen:'<path d="M9 5 3 11l6 6M3 11h11a6 6 0 0 1 0 12"/>'};
function icon(b,name){b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[name]+'</svg>';}
function closeDetail(){document.querySelector('.detail')?.remove()}
function showDetail(r,b){const was=document.querySelector('.detail')?.dataset.id===String(r.id);closeDetail();if(was)return;const d=el('div',undefined,'detail');d.dataset.id=String(r.id);d.setAttribute('role','status');d.append(el('strong',levelName(r)+' · '+r.score+'%'),el('small',(r.quiz_name||'Unknown quiz')+' · '+dateText(r.created_at)));if(r.support_status==='resolved')d.append(el('small','Resolved '+dateText(r.resolved_at)));document.body.append(d);const rect=b.getBoundingClientRect();d.style.left=Math.max(8,Math.min(rect.left,innerWidth-d.offsetWidth-8))+'px';d.style.top=Math.max(8,rect.bottom+d.offsetHeight+6>innerHeight?rect.top-d.offsetHeight-4:rect.bottom+4)+'px';}
document.addEventListener('click',e=>{if(!e.target.closest('.detail,.eye'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});window.addEventListener('resize',closeDetail);window.addEventListener('scroll',closeDetail,true);
function render(){closeDetail();const pending=records.filter(r=>r.support_status!=='resolved');const resolved=records.filter(r=>r.support_status==='resolved');$('pendingCount').textContent=pending.length;$('resolvedCount').textContent=resolved.length;$('average').textContent=records.length?Math.round(records.reduce((a,r)=>a+Number(r.score||0),0)/records.length)+'%':'—';$('pendingTabCount').textContent=`(${pending.length})`;$('resolvedTabCount').textContent=`(${resolved.length})`;$('tabPending').setAttribute('aria-selected',String(tab==='pending'));$('tabResolved').setAttribute('aria-selected',String(tab==='resolved'));updateQuizFilter();updateLevelFilter();const level=$('levelFilter').value;const q=$('search').value.trim().toLowerCase(),quiz=$('quizFilter').value;const filtered=records.filter(r=>(tab==='resolved'?r.support_status==='resolved':r.support_status!=='resolved')&&(!level||levelName(r)===level)&&(!quiz||(r.quiz_name||'Unknown quiz')===quiz)&&[r.student_name,r.quiz_name,levelName(r)].join(' ').toLowerCase().includes(q));$('rows').replaceChildren();$('empty').classList.toggle('hidden',filtered.length>0);visibleIds=filtered.map(r=>String(r.id));updateSelectionControls();
 for(const r of filtered){const card=el('article',undefined,'record');const name=el('span',r.student_name,'record-name');const eye=el('button',undefined,'iconbtn eye');eye.type='button';eye.title='View details';eye.setAttribute('aria-label','View details for '+r.student_name);icon(eye,'eye');eye.onclick=()=>showDetail(r,eye);const action=actionButton(r);const kind=r.support_status==='resolved'?'reopen':'resolve';action.title=action.textContent;action.setAttribute('aria-label',action.title+' for '+r.student_name);action.className='iconbtn '+kind;icon(action,kind);card.append(selectionCheckbox(r),name,eye,action);$('rows').append(card)} }
$('selectAll').addEventListener('change',e=>{for(const id of visibleIds){if(e.target.checked)selectedIds.add(id);else selectedIds.delete(id)}render()});$('deleteSelected').addEventListener('click',deleteSelected);$('refresh').addEventListener('click',load);$('tabPending').addEventListener('click',()=>{tab='pending';selectedIds.clear();render()});$('tabResolved').addEventListener('click',()=>{tab='resolved';selectedIds.clear();render()});$('search').addEventListener('input',render);$('quizFilter').addEventListener('change',render);$('levelFilter').addEventListener('change',render);
if(ready())load();else message('dashboardError','Setup required: add the matching Supabase public key.');
</script></body></html>
